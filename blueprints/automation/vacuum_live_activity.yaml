blueprint:
  name: "Robot Vacuum: Live Activity for iOS and Android"
  description: >-
    Version 1.0.0.
    Shows when your robot vacuum is cleaning, paused, or returning to its dock.
    Optionally displays cleaning progress and battery level, and links to a
    dashboard. This blueprint does not control the vacuum.
  domain: automation
  homeassistant:
    min_version: "2026.7.0"
  input:
    vacuum_entity:
      name: Robot vacuum
      selector:
        entity:
          filter:
            - domain: vacuum
    notify_actions:
      name: Companion app notification actions
      description: >-
        Enter one full action name per phone, such as
        notify.mobile_app_my_iphone or notify.mobile_app_my_android.
        Find them under Developer tools → Actions.
      selector:
        text:
          multiple: true
    extras:
      name: Optional display settings
      collapsed: true
      input:
        progress_sensor:
          name: Cleaning progress (%)
          description: Use a cleaning progress sensor with a numeric value from 0 to 100, not a battery sensor.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        battery_sensor:
          name: Battery level (%)
          description: >-
            Overrides the vacuum's battery_level attribute when the selected
            sensor reports a valid percentage.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        tap_path:
          name: Dashboard path to open on tap
          description: >-
            Relative Home Assistant path, such as /dashboard-home/cleaning.
            Leave blank to open the vacuum's more-info dialog.
          default: ""
          selector:
            text:

mode: restart

triggers:
  # A null "to" matches state changes without firing on attribute-only updates.
  - trigger: state
    entity_id: !input vacuum_entity
    to:
    id: state_change
  - trigger: state
    entity_id: !input vacuum_entity
    to:
      - "unknown"
      - "unavailable"
    for:
      minutes: 2
    id: offline
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: time_pattern
    minutes: "/5"
    id: metrics_refresh

variables:
  vacuum_entity: !input vacuum_entity
  notify_actions: !input notify_actions
  progress_sensor: !input progress_sensor
  battery_sensor: !input battery_sensor
  tap_path: !input tap_path
  # Keep the tag stable across restarts and within the 64-character limit.
  notification_tag: "{{ 'ha-vacuum-' ~ sha256(vacuum_entity)[:24] }}"
  trigger_id: "{{ trigger.id | default('manual') if trigger is defined else 'manual' }}"
  vacuum_state: "{{ states(vacuum_entity) }}"
  active: "{{ vacuum_state in ['cleaning', 'paused', 'returning'] }}"
  battery_attribute: "{{ state_attr(vacuum_entity, 'battery_level') }}"
  recipients: >-
    {{ notify_actions | map('trim')
       | select('match', '^notify[.]mobile_app_[a-z0-9_]+$')
       | unique | list }}

conditions:
  # Leave the current activity alone during brief integration reconnects.
  - condition: template
    value_template: >-
      {% if trigger_id == 'metrics_refresh' %}
        {{ active and (progress_sensor != '' or battery_sensor != '' or battery_attribute is not none) }}
      {% elif vacuum_state in ['unknown', 'unavailable'] %}
        {{ trigger_id in ['offline', 'startup', 'manual'] }}
      {% else %}
        {{ true }}
      {% endif %}

actions:
  - variables:
      notification_title: "{{ state_attr(vacuum_entity, 'friendly_name') or vacuum_entity }}"
      status_text: >-
        {{ {'cleaning': 'Cleaning', 'paused': 'Paused',
            'returning': 'Returning to dock'}.get(vacuum_state, vacuum_state) }}
      progress_raw: "{{ states(progress_sensor) if progress_sensor else none }}"
      battery_raw: "{{ states(battery_sensor) if battery_sensor else none }}"
      destination: >
        {% set path = tap_path | trim %}
        {{ path if path.startswith('/') and not path.startswith('//')
           else '/?more-info-entity-id=' ~ vacuum_entity }}
  - variables:
      progress: >-
        {{ progress_raw | float | round | int
           if is_number(progress_raw) and 0 <= progress_raw | float <= 100 else none }}
      battery: >-
        {% if is_number(battery_raw) and 0 <= battery_raw | float <= 100 %}
          {{ battery_raw | float | round | int }}
        {% elif battery_attribute is not boolean and is_number(battery_attribute)
                and 0 <= battery_attribute | float <= 100 %}
          {{ battery_attribute | float | round | int }}
        {% else %}
          {{ none }}
        {% endif %}
  - repeat:
      for_each: "{{ recipients }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ active }}"
          then:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ notification_title }}"
                message: >-
                  {{ status_text ~ (' · ' ~ progress ~ '% complete' if progress is not none else '')
                     ~ (' · Battery ' ~ battery ~ '%' if battery is not none else '') }}
                data: >-
                  {% set chip = ('Paused' if vacuum_state == 'paused' else
                                 ('Docking' if vacuum_state == 'returning' else
                                 (progress ~ '%' if progress is not none else 'Cleaning'))) %}
                  {% set base = {'tag': notification_tag, 'live_update': true,
                                 'sticky': true, 'alert_once': true,
                                 'notification_icon': 'mdi:robot-vacuum',
                                 'critical_text': chip, 'url': destination,
                                 'clickAction': destination} %}
                  {{ dict(base, progress=progress, progress_max=100)
                     if progress is not none else base }}
          else:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              data:
                message: clear_notification
                data:
                  tag: "{{ notification_tag }}"
